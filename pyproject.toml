[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shuzheng-audit"
version = "0.1.0"
description = "数证 Audit（Shuzheng Audit）：面向数字经济场景的多 Agent 数据结论审计与证据验证系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.30",
    "mcp>=1.0",
    "pytest>=8.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.35",
]

[tool.setuptools.packages.find]
include = ["core*", "skills*", "workflows*", "data*", "evals*", "app*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "skills"]
addopts = "-ra"
